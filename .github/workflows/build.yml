name: build-apk
on:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - name: Decode keystore
        run: |
          echo "${{ secrets.KEYSTORE_B64 }}" | base64 -d > app/keystore.p12
          ls -l app/keystore.p12
      - uses: gradle/actions/setup-gradle@v3
        with:
          gradle-version: '8.7'
      - name: Build release APK
        env:
          KEYSTORE_PATH: keystore.p12
          KEYSTORE_PASS: watchremote
          KEY_ALIAS: watchremote
        working-directory: app
        run: gradle assembleRelease --no-daemon --stacktrace
      - uses: actions/upload-artifact@v4
        with:
          name: watchremote-apk
          path: app/build/outputs/apk/release/*.apk
